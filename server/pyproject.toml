[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "error::DeprecationWarning:fastapi.*",
    "error::DeprecationWarning:starlette.*",
]

[tool.coverage.run]
source = ["core", "api", "services", "models"]
branch = true
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
